query IssuingHandover
    @factDocument(path: "scenarios/voucher-issue-subgraph")
    @factRows(relation: "graphitron_voucher_vouched_for")
    @factRows(relation: "graphitron_minted_key") {
  applications { results { id eierId internalGraphitronVoucher } }
}

query AcceptingEntity
    @factDocument(path: "scenarios/voucher-accept-subgraph")
    @factRows(relation: "graphitron_accept_vouched_for")
    @factRows(relation: "graphitron_minted_key") {
  results { id eierId grade details { subject } internalGraphitronVoucher }
}

query PerEntityIssuing
    @factDocument(path: "scenarios/voucher-issue-per-entity") {
  cases { title eventLog { caseId internalGraphitronVoucher } }
}

query PerEntityAccepting
    @factDocument(path: "scenarios/voucher-accept-per-entity")
    @factRows(relation: "graphitron_accept_vouched_for") {
  caseEventLogs { caseId events { what } internalGraphitronVoucher }
}
