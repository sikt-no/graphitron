# Test classes run concurrently; the methods inside one class do not. The same four settings
# graphitron carries, extended to this module once the win was measured rather than assumed:
# mvn test -pl :graphitron-model runs in 45s with these settings and 66s without, three rounds
# each, alternating. The same extension was tried for graphitron-lsp and graphitron-mcp and
# measured nothing on either, so neither carries this file; if you are adding it to a third
# module, measure that module rather than assuming it inherits this result.
#
# Measure it by alternating arms and deleting target/test-classes/junit-platform.properties in
# the arm that should not have it. Maven's resource copying does not remove a resource whose
# source file is gone, so a stale copy makes both arms parallel and the difference vanish. That
# mistake read as "parallelism does nothing here" for a while.
#
# Why this module is safe to run concurrently, stated rather than inherited. Almost every case
# here opens a private in-memory store through SeededStore.withSeededStore, and the store mints
# a UUID-named H2 database per call, so two classes share no rows. The single file-backed case
# takes a @TempDir, so it shares no directory either. That is also why the module is worth
# parallelising at all: its cost is almost entirely those per-case store boots, 152 of them.
#
# Methods stay same_thread. A class is the unit that owns a fixture, and two methods of one
# class routinely share what the class set up; keeping methods sequential makes concurrency
# safe without any per-class opt-out.
#
# The one thing this cannot make safe is process-global state, which a fixture boundary does
# not contain. A test that rebinds something JVM-wide wants @Isolated, as the two classes in
# graphitron that rebind ClassificationTrace's writer do, and the symptom if it does not is a
# sibling failing on state it never touched.
#
# Deliberately not setting junit.jupiter.extensions.autodetection.enabled, which graphitron
# does set: only that module registers an extension under META-INF/services, so enabling
# autodetection here would change nothing today and quietly activate anything added later.
#
# fixed parallelism of 4 rather than a machine-relative strategy, matching graphitron: the
# number is what CI and a contributor sandbox both have, and a strategy that scales with cores
# makes an ordering-sensitive failure reproduce on some machines and not others.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
