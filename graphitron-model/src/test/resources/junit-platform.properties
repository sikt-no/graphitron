# Test classes run concurrently; the methods inside one class do not. The same four settings
# graphitron carries, extended to this module once the win was measured rather than assumed:
# mvn test -pl :graphitron-model runs in 45s with these settings and 66s without, three rounds
# each, alternating. graphitron-lsp and graphitron-mcp run under this file too, without a copy of
# their own: it rides in this module's test-jar, which both put on their test classpath, and
# neither has a junit-platform.properties that would come first. graphitron's own file does come
# first, so it runs under that one. A module that starts carrying its own file stops inheriting
# this one, so measure it and restate what it needs rather than assuming this result.
#
# Measure it by alternating arms and deleting target/test-classes/junit-platform.properties in
# the arm that should not have it. Maven's resource copying does not remove a resource whose
# source file is gone, so a stale copy makes both arms parallel and the difference vanish. That
# mistake read as "parallelism does nothing here" for a while.
#
# Why this module is safe to run concurrently, stated rather than inherited. Almost every case
# here reaches its store through SeededStore.withSeededStore, and two classes on one thread do
# share a store: the thread boots one on its first case and keeps it, because applying the fact
# schema costs a few hundred milliseconds and truncating it costs under one. So what keeps two
# classes apart is not that they share nothing. It is that ThreadConfinedStore empties every
# relation a case can write to before each body, and asserts afterwards that the store holds
# exactly what a freshly booted one holds; a row that survived would fail the reset rather than
# passing quietly into the next case. Across threads nothing is shared at all, each thread's
# store being its own H2 database. The single file-backed case takes a @TempDir, so it shares no
# directory either.
#
# Concurrency is therefore also what sets the module's boot count: one boot per thread that runs
# a funnel case. That is not the same as one per configured worker, and the gap is measurable
# rather than theoretical, this pool having run funnel cases on eight threads at a parallelism of
# four because it compensates for blocked tasks. ThreadConfinedStoreTest pins the count as an
# equality against the threads that booted, for exactly that reason.
#
# Methods stay same_thread. A class is the unit that owns a fixture, and two methods of one
# class routinely share what the class set up; keeping methods sequential makes concurrency
# safe without any per-class opt-out.
#
# The one thing this cannot make safe is process-global state, which a fixture boundary does
# not contain. A test that rebinds something JVM-wide wants @Isolated, as the two classes in
# graphitron that rebind ClassificationTrace's writer do, and the symptom if it does not is a
# sibling failing on state it never touched.
#
# Autodetection is on, as it is in graphitron's file, for StoreCostExtension: this module
# registers it under META-INF/services, the registration rides in the test-jar beside this file,
# and so it reaches every module the store harness does. It writes nothing unless
# GRAPHITRON_STORE_COST_REPORT names a file. What autodetection costs is that anything else
# registered under META-INF/services on a consuming test classpath activates as well, so a new
# registration there is a change to every such module's run rather than to one.
#
# fixed parallelism of 4 rather than a machine-relative strategy, matching graphitron: the
# number is what CI and a contributor sandbox both have, and a strategy that scales with cores
# makes an ordering-sensitive failure reproduce on some machines and not others.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.extensions.autodetection.enabled=true
