junit.jupiter.extensions.autodetection.enabled=true

# Test classes run concurrently; the methods inside one class do not.
#
# Nothing else in the reactor sets these, so this module is the first: it is where the
# 170.5s-to-117.1s measurement behind the change was taken, and extending the same
# properties to the other classifying modules is unmeasured and belongs to its own item,
# one module at a time.
#
# Why classes and not methods. A class is the unit that owns a fixture here: a @TempDir
# and the H2 store captured into it, so two classes hold two stores and share nothing,
# while two methods of one class routinely share the store the class captured. Running
# methods same_thread keeps that sharing safe without any per-class opt-out, and costs
# nothing measurable, because the module's cost is spread across many classes rather than
# concentrated in a few long ones.
#
# The one thing this cannot make safe on its own is process-global state, which a fixture
# boundary does not contain. ClassificationTrace's writer is the case in the tree:
# rebinding it is a JVM-wide act, so the two classes that rebind it carry @Isolated. A new
# test that reaches for process-global state wants the same treatment, and the symptom if
# it does not is a sibling failing on state it never touched.
#
# fixed parallelism of 4 rather than a machine-relative strategy: the number is what CI
# and a contributor sandbox both have, and a strategy that scales with cores makes the
# suite's concurrency vary by machine, which turns an ordering-sensitive failure into one
# that reproduces on some machines and not others.
#
# And a pool that stops at 4. JUnit's pool compensates for a worker that blocks by starting
# another, up to the parallelism plus 256 by default, so "four at a time" is not what ran: this
# module's class times summed to 14,367 s against a 774 s test phase, about 19 classes in flight,
# and 30 distinct threads booted the per-thread store. Holding the pool at its parallelism, in
# interleaved runs on a 4-core machine with every test passing and no run hanging, took this
# module from 904 and 886 s to 784 and 715 s, graphitron-model from 393 to 337 s and graphitron-lsp
# from 218 to 145 s. The cost of the default was heap and garbage collection for stores and
# fixtures that a few threads would have shared, and a timing test that failed on a pause.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4
