version: 2
updates:
- package-ecosystem: "maven"
  directory: "/"
  # main only moves by sync-main.yml fast-forwarding it to the trunk, so pull requests
  # target the trunk, where they get CI against the current tree and can be merged.
  target-branch: "claude/graphitron-rewrite"
  schedule:
    interval: "weekly"
  groups:
    jackson-dependencies:
      patterns:
      - "com.fasterxml.jackson*"
    maven-plugins:
      patterns:
      - "org.apache.maven.plugins:*"
      - "org.codehaus.mojo:*"
    test-dependencies:
      patterns:
      - "org.junit*"
      - "org.assertj*"
      - "org.mockito*"
      - "com.approvaltests*"

- package-ecosystem: "github-actions"
  directory: "/"
  target-branch: "claude/graphitron-rewrite"
  schedule:
    interval: "weekly"