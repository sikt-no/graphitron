junit.jupiter.extensions.autodetection.enabled=true

# Test classes run concurrently; the methods inside one class do not. Same four settings
# `graphitron` and `graphitron-model` carry, for the same reasons, plus one this module owns.
#
# Why it matters here. This module is the reactor's terminal node: everything depends on it and
# nothing depends on it, so it can never overlap another module and whatever it spends is build
# wall clock. Running its 800-odd tests one at a time on a four-core box spent three of those
# cores on nothing.
#
# Why classes and not methods. A class is the unit that owns a fixture: each test class here opens
# its own DSLContext in @BeforeAll and, off the local-db path, its own PostgreSQL container. Two
# methods of one class routinely share what the class captured, so same_thread methods keep that
# sharing safe with no per-class opt-out.
#
# What a fixture boundary does not contain, and this module has two cases of it.
#
# The database. On the local-db path every class shares one PostgreSQL instance, so a class that
# writes to a table another class reads is visible to it. Writers scope their cleanup to rows they
# can name (a UUID marker, a title, an id); readers assert what their own query means rather than
# what a table holds. A test that asserts a row count over an unfiltered root field is asserting
# the second while meaning the first, and the symptom is a sibling failing on rows it never wrote.
#
# The Quarkus test deployment. io.quarkus.test.junit.QuarkusTestExtension keeps its per-test
# bookkeeping in static single slots, so two @QuarkusTest classes in flight overwrite each other's
# and then invoke one class's method against the other's instance. Parallel @QuarkusTest execution
# has never been supported upstream. Every @QuarkusTest class therefore carries
# QuarkusTestLock.KEY, which makes the four mutually exclusive while leaving them free to overlap
# every other class in the module; QuarkusTestLockEnforcementTest fails the build if a new one
# arrives without it.
#
# fixed parallelism of 4 rather than a machine-relative strategy: the number is what CI and a
# contributor sandbox both have, and a strategy that scales with cores makes the suite's
# concurrency vary by machine, which turns an ordering-sensitive failure into one that reproduces
# on some machines and not others.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
